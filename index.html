<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>中考全科备考工作台</title>
<style>
/* ============================================================
   主题变量（修改这里即可换肤）
   ============================================================ */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eef1f5; --surface-3:#e4e8ee;
  --text:#2b2f36; --text-dim:#717886; --border:#e2e6ec;
  --primary:#5b8def; --primary-soft:#e9f0fe; --primary-text:#3a6fd4;
  --danger:#e0584a; --danger-soft:#fdecea; --success:#3f9d77; --success-soft:#e7f4ee;
  --warn:#d98a2b;
  --shadow:0 1px 3px rgba(20,30,50,.08),0 4px 16px rgba(20,30,50,.05);
  --radius:14px; --radius-sm:10px;
  /* 七科配色（低饱和） */
  --s-语文:#c97b84; --s-数学:#5b8def; --s-英语:#4fa7a0; --s-物理:#b3895e;
  --s-化学:#8a7bc0; --s-道德与法治:#7ba05b; --s-历史:#c79a52; --s-体育:#3da35d;
}
[data-theme="dark"]{
  --bg:#14161b; --surface:#1d2027; --surface-2:#262a33; --surface-3:#2f343f;
  --text:#e6e9ef; --text-dim:#969cab; --border:#2c313b;
  --primary:#6f9bf5; --primary-soft:#23304a; --primary-text:#aac2fb;
  --danger:#e86f63; --danger-soft:#3a2622; --success:#56b58f; --success-soft:#1e332b;
  --warn:#e0a04a;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(66px + env(safe-area-inset-bottom));
  transition:background .25s,color .25s;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text);}
/* 触控最小区域 44px */
.tap{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;}

/* ---------- 顶部栏 ---------- */
header{
  position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);
  padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:10px;
  box-shadow:0 1px 6px rgba(0,0,0,.04);
}
header .title{font-size:16px;font-weight:700;letter-spacing:.5px;flex:1;display:flex;align-items:center;gap:8px;}
header .title svg{width:20px;height:20px;color:var(--primary);}
.exam-pill{
  display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--primary-text);
}
.exam-pill svg{width:14px;height:14px;}
.icon-btn{
  width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);color:var(--text-dim);
}
.icon-btn svg{width:20px;height:20px;}

/* ---------- 页面容器 ---------- */
main{padding:14px;max-width:760px;margin:0 auto;}
.page{display:none;animation:fade .25s ease;}
.page.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* ---------- 卡片 ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.card h2{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card h2 svg{width:18px;height:18px;color:var(--primary);}
.card .sub{font-size:12px;color:var(--text-dim);font-weight:400;}

/* ---------- 倒计时 ---------- */
.countdown{text-align:center;padding:10px 0 4px;}
.countdown .cd-num{font-size:54px;font-weight:800;line-height:1;color:var(--primary);letter-spacing:1px;font-variant-numeric:tabular-nums;}
.countdown .cd-unit{font-size:13px;color:var(--text-dim);margin-top:2px;}
.countdown .cd-sub{font-size:13px;color:var(--text-dim);margin-top:8px;}

/* ---------- 通用控件 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--radius-sm);font-size:15px;font-weight:600;background:var(--primary);color:#fff;transition:transform .08s,filter .15s;}
.btn:active{transform:scale(.97);}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
.btn.soft{background:var(--primary-soft);color:var(--primary-text);}
.btn.danger{background:var(--danger);color:#fff;}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:8px;}
.btn.block{width:100%;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.field label{font-size:13px;color:var(--text-dim);font-weight:600;}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:11px 12px;outline:none;transition:border .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
textarea{resize:vertical;min-height:80px;line-height:1.6;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.row > *{flex:1;min-width:0;}
.row.auto > *{flex:0 0 auto;}

/* 学科标签 */
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap;}
.prio{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;}
.prio.高{background:var(--danger-soft);color:var(--danger);}
.prio.中{background:#fbf0db;color:var(--warn);}
.prio.低{background:var(--surface-2);color:var(--text-dim);}
[data-theme=dark] .prio.中{background:#42361d;color:var(--warn);}

/* ---------- 里程碑 ---------- */
.ms-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.ms-item:last-child{border-bottom:none;}
.ms-dot{width:10px;height:10px;border-radius:50%;background:var(--primary);flex:none;}
.ms-info{flex:1;min-width:0;}
.ms-name{font-weight:600;font-size:14px;}
.ms-date{font-size:12px;color:var(--text-dim);}
.ms-left{font-weight:700;font-size:14px;text-align:right;white-space:nowrap;}
.ms-left.over{color:var(--danger);}
.ms-left.soon{color:var(--warn);}

/* ---------- 今日概览 ---------- */
.ov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.ov-cell{background:var(--surface-2);border-radius:var(--radius-sm);padding:14px 8px;text-align:center;}
.ov-cell .v{font-size:24px;font-weight:800;color:var(--primary);}
.ov-cell .l{font-size:12px;color:var(--text-dim);margin-top:2px;}

/* ---------- 任务板 ---------- */
.date-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.date-bar .d-label{flex:1;font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;}
.date-bar .d-label svg{width:16px;height:16px;color:var(--primary);}
.round-btn{width:38px;height:38px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;}
.round-btn svg{width:18px;height:18px;}
.today-banner{background:var(--primary-soft);color:var(--primary-text);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.today-banner svg{width:16px;height:16px;}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.filter-bar select{flex:1;min-width:120px;min-height:40px;padding:8px 10px;}
.task-add{background:var(--surface-2);border:1px dashed var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:14px;}
.task-list{display:flex;flex-direction:column;gap:10px;}
.task{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;display:flex;gap:10px;align-items:flex-start;transition:transform .1s,opacity .2s;cursor:grab;}
.task.dragging{opacity:.4;}
.task.done{opacity:.6;}
.task.overdue{border-color:var(--danger);background:var(--danger-soft);}
.task .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--border);flex:none;display:flex;align-items:center;justify-content:center;margin-top:2px;background:var(--surface);}
.task.done .chk{background:var(--success);border-color:var(--success);}
.task .chk svg{width:16px;height:16px;color:#fff;opacity:0;}
.task.done .chk svg{opacity:1;}
.task .body{flex:1;min-width:0;}
.task .tc{font-size:14px;font-weight:600;word-break:break-word;}
.task.done .tc{text-decoration:line-through;color:var(--text-dim);}
.task .meta{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap;}
.task .tomato{font-size:12px;color:var(--warn);font-weight:700;display:inline-flex;align-items:center;gap:2px;}
.task .roll-tag{font-size:11px;font-weight:700;color:var(--danger);background:var(--danger-soft);padding:2px 7px;border-radius:6px;}
.task .gtag{font-size:11px;font-weight:700;color:var(--primary-text);background:var(--primary-soft);padding:3px 9px;border-radius:6px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;}
.task .gtag:active{transform:scale(.94);}
.task .ops{display:flex;gap:4px;flex:none;}
.task .op{width:34px;height:34px;border-radius:8px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-dim);}
.task .op svg{width:16px;height:16px;}
.task .op.del{color:var(--danger);}
.task.done .op.tom{opacity:.4;pointer-events:none;}
.empty{text-align:center;color:var(--text-dim);padding:30px 10px;font-size:14px;}

/* ---------- 进度追踪 ---------- */
.seg{display:flex;gap:6px;background:var(--surface-2);border-radius:999px;padding:4px;margin-bottom:14px;}
.seg button{flex:1;min-height:38px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text-dim);}
.seg button.on{background:var(--surface);color:var(--primary-text);box-shadow:var(--shadow);}
.subj-bar{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);}
.subj-bar:last-child{border-bottom:none;}
.subj-bar .sb-name{width:74px;font-weight:600;font-size:13px;flex:none;}
.subj-bar .sb-track{flex:1;height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;}
.subj-bar .sb-fill{height:100%;border-radius:999px;transition:width .4s;}
.subj-bar .sb-pct{width:42px;text-align:right;font-weight:700;font-size:13px;flex:none;font-variant-numeric:tabular-nums;}
.topic{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.topic:last-child{border-bottom:none;}
.topic .tchk{width:24px;height:24px;border-radius:7px;border:2px solid var(--border);flex:none;display:flex;align-items:center;justify-content:center;background:var(--surface);}
.topic.done .tchk{background:var(--success);border-color:var(--success);}
.topic .tchk svg{width:15px;height:15px;color:#fff;opacity:0;}
.topic.done .tchk svg{opacity:1;}
.topic .tname{flex:1;font-size:14px;}
.topic.done .tname{color:var(--text-dim);text-decoration:line-through;}
.topic .top{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);background:var(--surface-2);}
.topic .top svg{width:15px;height:15px;}
.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--primary-text);font-weight:600;font-size:14px;margin-bottom:10px;}
.back-btn svg{width:16px;height:16px;}

/* ---------- 成绩看板 ---------- */
.chart-wrap{overflow-x:auto;margin-top:6px;}
.chart{width:100%;max-width:380px;height:auto;display:block;margin:0 auto;}
.grid{stroke:var(--border);stroke-width:1;}
.axis{fill:var(--text-dim);font-size:9px;}
.target{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:5 4;}
.target-t{fill:var(--warn);}
.radar-ring{fill:none;stroke:var(--border);stroke-width:1;}
.radar-axis{stroke:var(--border);stroke-width:1;}
.radar-poly{opacity:.85;}
.score-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.score-cell{background:var(--surface-2);border-radius:var(--radius-sm);padding:12px;text-align:center;}
.score-cell .sc-sub{font-size:12px;color:var(--text-dim);font-weight:600;}
.score-cell .sc-v{font-size:22px;font-weight:800;margin-top:2px;}
.score-cell .sc-d{font-size:11px;color:var(--text-dim);}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--text-dim);margin-top:8px;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle;}
.exam-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);}
.exam-item:last-child{border-bottom:none;}
.exam-item .ei-name{flex:1;font-weight:600;font-size:14px;}
.exam-item .ei-date{font-size:12px;color:var(--text-dim);}
.exam-item .ei-total{font-weight:700;color:var(--primary);}

/* ---------- 复盘 ---------- */
.q-field{margin-bottom:12px;}
.q-field .q-label{font-size:13px;font-weight:700;color:var(--primary-text);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.q-field .q-label svg{width:15px;height:15px;}
.rev-hist{margin-top:6px;}
.rev-day{background:var(--surface-2);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;border-left:3px solid var(--primary);}
.rev-day .rd-date{font-weight:700;font-size:13px;margin-bottom:6px;color:var(--text-dim);}
.rev-day .rd-line{font-size:13px;margin:3px 0;}
.rev-day .rd-line b{color:var(--primary-text);}

/* ---------- 底部导航 ---------- */
.bottom-tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);
  border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -2px 12px rgba(0,0,0,.06);
}
.bottom-tabs button{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-dim);font-size:11px;font-weight:600;padding:6px 2px;}
.bottom-tabs button svg{width:22px;height:22px;}
.bottom-tabs button.on{color:var(--primary);}
.bottom-tabs button.on svg{filter:drop-shadow(0 0 0 var(--primary));}

/* ---------- 弹窗 ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,20,30,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(2px);}
.overlay.show{display:flex;animation:fade .2s;}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:380px;padding:20px;box-shadow:var(--shadow);max-height:86vh;overflow:auto;}
.modal h3{margin:0 0 14px;font-size:17px;font-weight:700;}
.modal .actions{display:flex;gap:10px;margin-top:16px;}
.modal .actions .btn{flex:1;}

/* 番茄钟 */
.tomato-modal{text-align:center;}
.tomato-ring{position:relative;width:200px;height:200px;margin:14px auto;}
.tomato-ring svg{transform:rotate(-90deg);}
.tomato-time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.tomato-time .tt-num{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;}
.tomato-time .tt-sub{font-size:13px;color:var(--text-dim);}
.tomato-task{font-size:13px;color:var(--text-dim);margin-top:4px;}

/* 登录 gate */
.login-overlay{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;}
.login-overlay.hidden{display:none;}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:28px 22px;width:100%;max-width:340px;box-shadow:var(--shadow);text-align:center;}
.login-card .lc-logo{width:46px;height:46px;margin:0 auto 10px;color:var(--primary);}
.login-card h2{margin:0 0 4px;font-size:19px;font-weight:800;}
.login-card .sub{color:var(--text-dim);font-size:13px;margin-bottom:20px;}
.login-card .field{text-align:left;margin-bottom:12px;}
.login-err{color:var(--danger);font-size:13px;min-height:18px;margin-top:8px;font-weight:600;}

/* Toast */
#toast-wrap{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
.toast{background:rgba(30,34,42,.94);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:toastIn .25s ease;max-width:90vw;text-align:center;}
@keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

/* 备份横幅 */
.backup-banner{background:var(--warn);color:#fff;border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.backup-banner svg{width:16px;height:16px;}
.hidden{display:none!important;}
.foot-note{text-align:center;font-size:11px;color:var(--text-dim);padding:6px 0 2px;}
</style>
</head>
<body>

<header>
  <div class="title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h7v7H3zM14 3h7v4h-7zM14 10h7v11h-7zM3 13h7v8H3z"/></svg>
    中考备考台
  </div>
  <button class="exam-pill tap" id="examEditBtn" title="修改中考日期">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    <span id="examDateLabel">--</span>
  </button>
  <button class="icon-btn tap" id="themeBtn" title="切换主题">
    <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<main>
  <!-- ============ 指挥台 ============ -->
  <section class="page active" id="page-command">
    <div id="backupBanner" class="backup-banner hidden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
      <span id="backupBannerText"></span>
    </div>

    <div class="card">
      <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>中考倒计时</h2>
      <div class="countdown">
        <div class="cd-num" id="cdDays">--</div>
        <div class="cd-unit">天</div>
        <div class="cd-sub" id="cdHms">--:--:--</div>
      </div>
    </div>

    <div class="card">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/></svg>
        关键里程碑
        <span class="sub" style="margin-left:auto;font-weight:600;color:var(--primary);" id="addMsBtn">+ 添加</span>
      </h2>
      <div id="msList"></div>
    </div>

    <div class="card">
      <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>今日总览</h2>
      <div class="ov-grid">
        <div class="ov-cell"><div class="v" id="ovDone">0</div><div class="l">今日已完成</div></div>
        <div class="ov-cell"><div class="v" id="ovTotal">0</div><div class="l">今日任务总数</div></div>
        <div class="ov-cell"><div class="v" id="ovWeek">0</div><div class="l">本周学习天数</div></div>
      </div>
    </div>

    <div class="card">
      <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>数据备份</h2>

<script>
/* ============================================================================
   中考全科备考工作台  —  单文件 / 零依赖 / LocalStorage 持久化
   ----------------------------------------------------------------------------
   想自行修改？看这几处就够了：
   1) SUBJECTS        —— 七科列表（顺序即展示顺序）
   2) SUBJECT_COLORS  —— 每科配色（与 CSS 变量对应）
   3) DEFAULT_TOPICS  —— 每科默认专题清单（可自由增删）
   4) 中考默认日期    —— initState() 里的 '2027-06-15'
   ============================================================================ */
(function(){
"use strict";

/* ---------- 可配置区 ---------- */
const SUBJECTS = ['语文','数学','英语','物理','化学','道德与法治','历史','体育'];
const ACADEMIC = SUBJECTS.filter(s=>s!=='体育'); // 七门文化课（目标线统一设置）
const SUBJECT_COLORS = {
  '语文':'var(--s-语文)','数学':'var(--s-数学)','英语':'var(--s-英语)','物理':'var(--s-物理)',
  '化学':'var(--s-化学)','道德与法治':'var(--s-道德与法治)','历史':'var(--s-历史)','体育':'var(--s-体育)'
};
const DEFAULT_TOPICS = {
  '语文':['古诗文默写','文言文阅读','现代文阅读','名著阅读','语言运用','作文训练','基础知识'],
  '数学':['数与式','方程与不等式','函数','三角形','四边形','圆','图形变换','统计与概率'],
  '英语':['听力训练','语法梳理','词汇积累','完形填空','阅读理解','任务型阅读','书面表达'],
  '物理':['声现象','光现象','物态变化','力学','压强与浮力','简单机械与功','电学','电与磁','热学','实验探究'],
  '化学':['物质构成','空气与氧气','碳和碳的化合物','金属与金属材料','溶液','酸碱盐','化学与生活','化学实验'],
  '道德与法治':['心理与健康','道德与品质','法治精神','国家制度','国情与时事','民族团结'],
  '历史':['中国古代史','中国近代史','中国现代史','世界古代史','世界近代史','世界现代史','材料解析'],
  '体育':['1000/800米跑','立定跳远','实心球','引体向上/仰卧起坐','跳绳','篮球运球','足球运球','排球垫球','游泳','体能训练']
};

/* ---------- LocalStorage 键 ---------- */
const K = {
  examDate:'wb_zk_examDate', milestones:'wb_zk_milestones', tasks:'wb_zk_tasks',
  topics:'wb_zk_topics', scores:'wb_zk_scores', targets:'wb_zk_targets',
  reviews:'wb_zk_reviews', theme:'wb_zk_theme', seen:'wb_zk_seenSample', pe:'wb_zk_pe'
};

/* ---------- 工具函数 ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
/* 存储层：file:// 双击打开时部分浏览器会禁用 localStorage，这里做安全降级 */
const _mem={};
let _lsOK=true;
try{ const _t='__zk_probe__'; localStorage.setItem(_t,_t); localStorage.removeItem(_t); }
catch(e){ _lsOK=false; }
function lsGet(k){ if(_lsOK){ try{ return localStorage.getItem(k); }catch(e){} } return (k in _mem)?_mem[k]:null; }
function lsSet(k,v){ if(_lsOK){ try{ localStorage.setItem(k,v); return; }catch(e){} } _mem[k]=v; }
function load(key,def){ try{ const v=lsGet(key); return v==null?def:JSON.parse(v); }catch(e){ return def; } }
function save(key,val){ lsSet(key,JSON.stringify(val)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ const d=new Date(); return fmt(d); }
function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(dateStr,n){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return fmt(d); }
function dayDiff(a,b){ return Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/86400000); }
function getWeekMonday(){ const d=new Date(); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return fmt(d); }

/* ---------- 状态 ---------- */
let state;
function initState(){
  state = {
    examDate: load(K.examDate,'2027-06-15'),
    milestones: load(K.milestones,[]),
    tasks: load(K.tasks,[]),
    topics: load(K.topics,null),
    scores: load(K.scores,[]),
    targets: load(K.targets,{}),
    reviews: load(K.reviews,{}),
    theme: load(K.theme,'light'),
    pe: load(K.pe,{max:30,target:''})
  };
  if(state.topics==null){
    state.topics={};
    SUBJECTS.forEach(s=> state.topics[s]=DEFAULT_TOPICS[s].map(n=>({id:uid(),name:n,done:false})) );
  }
  // 首次运行：写入示例数据（含 1 条逾期任务）
  if(!load(K.seen,false)){
    const y = addDays(todayStr(),-1);
    state.milestones = [
      {id:uid(),name:'中考报名截止',date:'2027-03-01',note:''},
      {id:uid(),name:'体育中考',date:'2027-04-10',note:''},
      {id:uid(),name:'一模',date:'2027-05-08',note:''},
      {id:uid(),name:'二模',date:'2027-05-29',note:''}
    ];
    state.tasks = [
      {id:uid(),date:y,subject:'数学',content:'复习函数专题（昨日未完，已顺延）',priority:'高',done:false,tomatoes:0,order:0,rolled:true},
      {id:uid(),date:todayStr(),subject:'英语',content:'背诵中考核心词汇 List 12',priority:'中',done:false,tomatoes:0,order:1,rolled:false},
      {id:uid(),date:todayStr(),subject:'语文',content:'完成一篇议论文提纲训练',priority:'中',done:false,tomatoes:1,order:2,rolled:false},
      {id:uid(),date:todayStr(),subject:'物理',content:'整理浮力错题 5 道',priority:'低',done:false,tomatoes:0,order:3,rolled:false}
    ];
    save(K.seen,true);
  }
}
function persist(){
  save(K.examDate,state.examDate);
  save(K.milestones,state.milestones);
  save(K.tasks,state.tasks);
  save(K.topics,state.topics);
  save(K.scores,state.scores);
  save(K.targets,state.targets);
  save(K.reviews,state.reviews);
  save(K.theme,state.theme);
  save(K.pe,state.pe);
}

/* ---------- Toast ---------- */
function toast(msg){
  const w=$('#toast-wrap'); const t=document.createElement('div');
  t.className='toast'; t.textContent=msg; w.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); },1800);
}

/* ---------- 弹窗 ---------- */
function openModal(html){ $('#modalBox').innerHTML=html; $('#overlay').classList.add('show'); }
function closeModal(){ $('#overlay').classList.remove('show'); }
$('#overlay').addEventListener('click',e=>{ if(e.target===$('#overlay')) closeModal(); });

/* 二次确认 */
function confirmBox(title,msg,onYes){
  openModal(`<h3>${title}</h3><p style="color:var(--text-dim);font-size:14px;line-height:1.6;">${msg}</p>
    <div class="actions"><button class="btn ghost" id="cfNo">取消</button><button class="btn danger" id="cfYes">确认</button></div>`);
  $('#cfNo').onclick=closeModal;
  $('#cfYes').onclick=()=>{ closeModal(); onYes(); };
}

/* ============================================================================
   模块一：指挥台
   ============================================================================ */
let cdTimer=null;
function renderCommand(){
  // 倒计时
  $('#examDateLabel').textContent = state.examDate;
  function tick(){
    const now=new Date(); const target=new Date(state.examDate+'T00:00:00');
    let diff=target-now; if(diff<0)diff=0;
    const d=Math.floor(diff/86400000);
    const h=Math.floor(diff%86400000/3600000);
    const m=Math.floor(diff%3600000/60000);
    const s=Math.floor(diff%60000/1000);
    $('#cdDays').textContent=d;
    $('#cdHms').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  if(cdTimer)clearInterval(cdTimer);
  tick(); cdTimer=setInterval(tick,1000);

  // 里程碑
  const ms=state.milestones.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const ml=$('#msList'); ml.innerHTML='';
  if(ms.length===0){ ml.innerHTML='<div class="empty">还没有里程碑，点右上角「+ 添加」</div>'; }
  ms.forEach(m=>{
    const left=dayDiff(m.date,todayStr());
    let cls='', txt='';
    if(left<0){ cls='over'; txt='已过期'; }
    else if(left<=7){ cls='soon'; txt='剩 '+left+' 天'; }
    else { txt='剩 '+left+' 天'; }
    const el=document.createElement('div'); el.className='ms-item';
    el.innerHTML=`<div class="ms-dot"></div>
      <div class="ms-info"><div class="ms-name">${esc(m.name)}</div><div class="ms-date">${m.date}</div></div>
      <div class="ms-left ${cls}">${txt}</div>
      <button class="op round-btn" data-delms="${m.id}" style="width:34px;height:34px;"><svg viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>`;
    ml.appendChild(el);
  });

function rollYesterday(){
  const y=addDays(todayStr(),-1);
  const undone=state.tasks.filter(t=>t.date===y && !t.done);
  if(undone.length===0){ toast('昨日没有未完成任务'); return; }
  undone.forEach(t=>{ t.date=todayStr(); t.rolled=true; });
  persist(); taskDate=todayStr(); renderTasks(); toast('已顺延 '+undone.length+' 项到今天');
}

function renderTasks(){

          ${t.multi?`<span class="gtag" data-gid="${t.gid}" title="点击批量管理（编辑/删除全部天数）">多天 ▾</span>`:''}
        </div>

function openGroupModal(gid){
  const group=state.tasks.filter(t=>t.gid===gid);
  if(!group.length) return;
  const t0=group[0];
  const dates=group.map(t=>t.date).sort();
  const subjOpts=SUBJECTS.map(s=>`<option value="${s}" ${s===t0.subject?'selected':''}>${s}</option>`).join('');
  const prioOpts=['高','中','低'].map(p=>`<option value="${p}" ${p===t0.priority?'selected':''}>${p}</option>`).join('');
  openModal(`<h3>多天任务 · 共 ${group.length} 天</h3>
    <div class="foot-note" style="margin-bottom:10px;">日期：${dates[0]} ~ ${dates[dates.length-1]}</div>
    <div class="field"><label>任务内容</label><input type="text" id="geContent" value="${esc(t0.content)}"></div>
    <div class="row">
      <div class="field"><label>学科</label><select id="geSubject">${subjOpts}</select></div>
      <div class="field"><label>优先级</label><select id="gePrio">${prioOpts}</select></div>
    </div>
    <div class="actions"><button class="btn ghost" id="geCancel">取消</button><button class="btn" id="geSave">保存并应用到全部</button></div>
    <button class="btn danger block" id="geDelAll" style="margin-top:10px;">删除整个多天任务（${group.length} 天）</button>`);
  $('#geCancel').onclick=closeModal;
  $('#geSave').onclick=()=>{

  };

function findTask(id){ return state.tasks.find(t=>t.id===id); }
function reorder(id,dir){
  const dayList=state.tasks.filter(t=>t.date===taskDate).sort((a,b)=>a.order-b.order);
  const i=dayList.findIndex(t=>t.id===id); const j=i+dir;
  if(j<0||j>=dayList.length)return;
  const a=dayList[i].order, b=dayList[j].order;
  dayList[i].order=b; dayList[j].order=a;
  persist(); renderTasks();
}
function bindDrag(wrap){
  let dragId=null;
  $$('.task',wrap).forEach(el=>{
    el.addEventListener('dragstart',()=>{ dragId=el.dataset.id; el.classList.add('dragging'); });
    el.addEventListener('dragend',()=>{ el.classList.remove('dragging'); });
    el.addEventListener('dragover',e=>{ e.preventDefault(); });
    el.addEventListener('drop',e=>{
      e.preventDefault(); if(!dragId||dragId===el.dataset.id)return;
      const dayList=state.tasks.filter(t=>t.date===taskDate).sort((a,b)=>a.order-b.order);
      const from=dayList.findIndex(t=>t.id===dragId);
      const to=dayList.findIndex(t=>t.id===el.dataset.id);
      if(from<0||to<0)return;
      const moved=dayList.splice(from,1)[0]; dayList.splice(to,0,moved);
      dayList.forEach((t,idx)=> t.order=idx);
      persist(); renderTasks(); dragId=null;
    });
  });
}

$('#addTaskBtn').onclick=()=>{
  const content=$('#taskContent').value.trim();
  const subject=$('#taskSubject').value;
  const priority=$('#taskPrio').value;
  if(!content){ toast('请填写任务内容'); return; }
  const start=$('#taskStart').value||taskDate;
  let end=$('#taskEnd').value||start;
  if(end<start){ toast('结束日期不能早于开始日期'); return; }
  const multi = end!==start;
  const gid = multi? uid() : null;
  let d=start, made=0;
  while(d<=end){
    const maxOrder=Math.max(-1,...state.tasks.filter(t=>t.date===d).map(t=>t.order));
    state.tasks.push({id:uid(),date:d,subject,content,priority,done:false,tomatoes:0,order:maxOrder+1,rolled:false,multi,gid});
    d=addDays(d,1); made++;
  }
  $('#taskContent').value=''; $('#taskEnd').value=''; $('#taskStart').value='';
  persist(); renderTasks(); renderCommand();
  toast(multi? `已添加多天任务（${made} 天）` : '已添加任务');
};

/* ---------- 番茄钟 ---------- */
let tom={id:null,timer:null,remain:25*60,running:false,total:25*60};
const ARC=2*Math.PI*90;
function startTomato(taskId){
  const t=findTask(taskId); if(!t)return;
  tom={id:taskId,timer:null,remain:25*60,running:false,total:25*60};
  $('#tomatoTaskName').textContent=t.subject+' · '+t.content;
  $('#tomatoNum').textContent='25:00';
  $('#tomatoArc').style.strokeDashoffset=0;
  $('#tomatoState').textContent='准备开始';
  $('#tomatoToggle').textContent='开始';
  $('#tomatoOverlay').classList.add('show');
}
function tomatoTick(){
  tom.remain--;
  const mm=String(Math.floor(tom.remain/60)).padStart(2,'0');
  const ss=String(tom.remain%60).padStart(2,'0');
  $('#tomatoNum').textContent=mm+':'+ss;
  const frac=(tom.total-tom.remain)/tom.total;
  $('#tomatoArc').style.strokeDashoffset=ARC*frac;
  if(tom.remain<=0) tomatoFinish();
}
$('#tomatoToggle').onclick=()=>{
  if(tom.running){ clearInterval(tom.timer); tom.running=false; $('#tomatoToggle').textContent='继续'; $('#tomatoState').textContent='已暂停'; }
  else { tom.running=true; $('#tomatoToggle').textContent='暂停'; $('#tomatoState').textContent='专注中'; tom.timer=setInterval(tomatoTick,1000); }
};
$('#tomatoStop').onclick=()=>{
  if(tom.running)clearInterval(tom.timer);
  $('#tomatoOverlay').classList.remove('show');
};
function tomatoFinish(){
  clearInterval(tom.timer); tom.running=false;
  beep();
  const t=findTask(tom.id); if(t){ t.tomatoes=(t.tomatoes||0)+1; persist(); }
  $('#tomatoOverlay').classList.remove('show');
  toast('🍅 专注完成，已记录 1 个番茄');
  if(currentTab==='tasks') renderTasks();
}
function beep(){ try{ const ctx=new(window.AudioContext||window.webkitAudioContext)(); const o=ctx.createOscillator(); o.connect(ctx.destination); o.frequency.value=880; o.start(); setTimeout(()=>o.stop(),350);}catch(e){} }

function renderPe(){
  $('#peMax').value = state.pe.max!=='' && state.pe.max!=null ? state.pe.max : '';
  $('#peTarget').value = state.pe.target!=='' && state.pe.target!=null ? state.pe.target : '';
  const peScores = state.scores.map(e=> e.scores['体育']!=null? +e.scores['体育']:null).filter(v=>v!=null);
  const latest = peScores.length? peScores[peScores.length-1] : null;
  const target = +state.pe.target||0, max = +state.pe.max||0;
  let html='';
  if(latest!=null && target){
    const pct=Math.max(0,Math.min(100,Math.round(latest/target*100)));
    html=`<div style="font-size:13px;color:var(--text-dim);margin-bottom:6px;">最近一次体育成绩：<b style="color:var(--text)">${latest}</b> / 目标 ${target}（满分 ${max||'—'}）</div>

      <div style="text-align:right;font-weight:700;color:var(--s-体育);margin-top:4px;">达成率 ${pct}%</div>`;
  } else if(target){
    html=`<div style="font-size:13px;color:var(--text-dim);">目标 ${target}（满分 ${max||'—'}）。在「录入一次考试」中填入体育成绩后，这里显示达成进度。</div>`;
  } else {
    html=`<div style="font-size:13px;color:var(--text-dim);">设置满分与目标分，并在考试中录入体育成绩后，这里显示达成进度。</div>`;
  }
  $('#peProgress').innerHTML=html;
}
function sortedExams(){ return state.scores.slice().sort((a,b)=>a.date.localeCompare(b.date)); }
function totalTrendChart(){
  const ex=sortedExams();
  if(ex.length===0) return '<div class="empty">录入考试后自动生成趋势图</div>';
  const labels=ex.map(e=>e.date.slice(5));
  const values=ex.map(e=>{ let s=0,c=0; SUBJECTS.forEach(sb=>{ if(e.scores[sb]!=null){s+=+e.scores[sb];c++;} }); return c?s:null; });
  const acaSet=ACADEMIC.every(sb=>state.targets[sb]!=='' && state.targets[sb]!=null);
  const peSet=state.pe.target!=='' && state.pe.target!=null;
  const allSet=acaSet && peSet;
  const targetSum=allSet? ACADEMIC.reduce((a,sb)=>a+(+state.targets[sb]||0),0)+(+state.pe.target||0):null;
  return svgLine({labels,values,target: targetSum, color:'var(--primary)', title:'总分'});
}
function lineChartFor(subj){
  const ex=sortedExams();
  const recent=ex.slice(-10);
  if(recent.length===0) return '<div class="empty">暂无「'+subj+'」成绩数据</div>';
  const labels=recent.map(e=>e.date.slice(5));
  const values=recent.map(e=> e.scores[subj]!=null? +e.scores[subj]:null);
  if(values.every(v=>v==null)) return '<div class="empty">暂无「'+subj+'」成绩数据</div>';
  return svgLine({labels,values,target: state.targets[subj]?+state.targets[subj]:null, color:SUBJECT_COLORS[subj], title:subj});
}
function radarChart(){
  const subjects=SUBJECTS;
  const avgs=subjects.map(s=>{
    const vals=state.scores.map(e=> e.scores[s]!=null? +e.scores[s]:null).filter(v=>v!=null);
    return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;
  });
  if(!avgs.some(v=>v!=null)) return '<div class="empty">录入成绩并设定目标后，展示均衡度雷达</div>';
  const useTarget=ACADEMIC.some(s=>state.targets[s]) || !!state.pe.target;
  const raw=subjects.map((s,i)=>{ const a=avgs[i]; if(a==null) return 0;
    const tgt = (s==='体育')? (+state.pe.target||0) : (+state.targets[s]||0);
    if(useTarget){ return tgt? Math.round(a/tgt*100):0; }
    return Math.round(a); });
  const maxA=Math.max(...raw.filter(v=>v>0),1);
  const disp= useTarget? raw : raw.map(v=> Math.round(v/maxA*100));
  const targetRing= useTarget? [100] : null;
  return svgRadar([{values:disp,color:'var(--primary)',fill:'var(--primary-soft)'}], subjects, targetRing);
}

/* ----- 手写 SVG 折线图 ----- */
function svgLine(o){
  const W=340,H=200,padL=34,padR=14,padT=18,padB=30;
  const vals=o.values.filter(v=>v!=null);
  if(vals.length===0) return '<div class="empty">暂无数据</div>';
  let min=Math.min(...vals), max=Math.max(...vals);
  if(o.target!=null){ min=Math.min(min,o.target); max=Math.max(max,o.target); }
  if(min===max){ min-=10; max+=10; }
  const range=max-min||1;
  const iW=W-padL-padR, iH=H-padT-padB, n=o.values.length;
  const xAt=i=> n<=1? padL+iW/2 : padL+iW*i/(n-1);
  const yAt=v=> padT+iH*(1-(v-min)/range);
  let g='';
  for(let k=0;k<=4;k++){ const yv=min+range*k/4, y=yAt(yv);
    g+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" class="grid"/>`;
    g+=`<text x="${padL-4}" y="${y+3}" class="axis" text-anchor="end">${Math.round(yv)}</text>`; }
  let tl='';
  if(o.target!=null){ const ty=yAt(o.target);
    tl=`<line x1="${padL}" y1="${ty}" x2="${W-padR}" y2="${ty}" class="target"/>`;
    tl+=`<text x="${W-padR}" y="${ty-4}" class="axis target-t" text-anchor="end">目标 ${o.target}</text>`; }
  let pts='',pl='';
  o.values.forEach((v,i)=>{ if(v==null)return; const x=xAt(i),y=yAt(v); pts+=`<circle cx="${x}" cy="${y}" r="3" fill="${o.color}"/>`; pl+=(pl?' ':'')+x+','+y; });
  let xl=''; const step=Math.max(1,Math.ceil(n/8));
  o.labels.forEach((lb,i)=>{ if(i%step===0||i===n-1){ const x=xAt(i); xl+=`<text x="${x}" y="${H-8}" class="axis" text-anchor="middle">${lb}</text>`; } });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${g}${tl}<polyline points="${pl}" fill="none" stroke="${o.color}" stroke-width="2.2" stroke-linejoin="round"/>${pts}${xl}</svg>`;
}
/* ----- 手写 SVG 雷达图 ----- */
function svgRadar(series,labels,targets){
  const W=320,H=300,cx=W/2,cy=H/2+4,R=104;
  const n=labels.length, scaleMax=140;
  const ang=i=> -Math.PI/2 + i*2*Math.PI/n;
  const pt=(i,r)=>[cx+r*Math.cos(ang(i)), cy+r*Math.sin(ang(i))];
  let rings='';
  [0.25,0.5,0.75,1].forEach(f=>{ let p=''; for(let i=0;i<n;i++){const[x,y]=pt(i,R*f);p+=(i?' ':'')+x+','+y;} rings+=`<polygon points="${p}" class="radar-ring"/>`; });
  let axes=''; labels.forEach((lb,i)=>{ const[x,y]=pt(i,R); axes+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" class="radar-axis"/><text x="${x}" y="${y+(y>cy?13:-5)}" class="axis" text-anchor="middle">${lb}</text>`; });
  let polys='';
  if(targets&&targets.length){ let p=''; targets.forEach((tv,i)=>{const[x,y]=pt(i,R*Math.min(tv,scaleMax)/scaleMax);p+=(i?' ':'')+x+','+y;}); polys+=`<polygon points="${p}" fill="none" stroke="var(--warn)" stroke-width="1.6" stroke-dasharray="5 4"/>`; }
  series.forEach(s=>{ let p=''; s.values.forEach((v,i)=>{const[x,y]=pt(i,R*Math.min(v,scaleMax)/scaleMax);p+=(i?' ':'')+x+','+y;});
    polys+=`<polygon points="${p}" fill="${s.fill}" stroke="${s.color}" stroke-width="2" class="radar-poly"/>`;
    s.values.forEach((v,i)=>{const[x,y]=pt(i,R*Math.min(v,scaleMax)/scaleMax);polys+=`<circle cx="${x}" cy="${y}" r="2.5" fill="${s.color}"/>`;}); });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${rings}${axes}${polys}</svg>`;
}

function renderExamList(){
  const wrap=$('#examList'); const ex=sortedExams().reverse();
  wrap.innerHTML='';
  if(ex.length===0){ wrap.innerHTML='<div class="empty">还没有考试记录</div>'; return; }
  ex.forEach(e=>{
    let total=0,c=0; SUBJECTS.forEach(sb=>{ if(e.scores[sb]!=null){ total+=+e.scores[sb]; c++; } });
    const el=document.createElement('div'); el.className='exam-item';
    el.innerHTML=`<div><div class="ei-name">${esc(e.name)}</div><div class="ei-date">${e.date}</div></div>
      <div class="ei-total">${c?total:'—'}</div>
      <button class="op" data-delexam="${e.id}" style="width:34px;height:34px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--danger);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>`;
    wrap.appendChild(el);
  });
  $$('[data-delexam]',wrap).forEach(b=> b.onclick=()=>{ state.scores=state.scores.filter(x=>x.id!==b.dataset.delexam); persist(); renderScores(); toast('已删除考试记录'); });
}

/* 录入考试 */
$('#addExamBtn').onclick=()=>{
  const name=$('#examName').value.trim(); const date=$('#examDate').value;
  if(!name||!date){ toast('请填写考试名称和日期'); return; }
  const scores={}; let any=false;
  SUBJECTS.forEach(s=>{ const v=$(`[data-score="${s}"]`).value; if(v!==''){ scores[s]=+v; any=true; } });
  if(!any){ toast('至少录入一科分数'); return; }
  state.scores.push({id:uid(),name,date,scores});
  $('#examName').value=''; SUBJECTS.forEach(s=> $(`[data-score="${s}"]`).value='');
  persist(); renderScores(); toast('已保存考试记录');
};
$('#saveTargetBtn').onclick=()=>{
  ACADEMIC.forEach(s=>{ const v=$(`[data-target="${s}"]`).value; state.targets[s]= v!==''? +v : ''; });
  persist(); renderScores(); toast('目标线已保存');
};
$('#savePeBtn').onclick=()=>{
  state.pe.max = $('#peMax').value!==''? +$('#peMax').value : '';
  state.pe.target = $('#peTarget').value!==''? +$('#peTarget').value : '';
  persist(); renderScores(); toast('体育目标已保存');
};
$('#lineSubject').onchange=renderScores;

/* ============================================================================
   模块五：每日复盘
   ============================================================================ */
function renderReview(){
  const d=todayStr();
  $('#revDate').textContent=d;
  const r=state.reviews[d]||{best:'',adjust:'',blackhole:'',note:''};
  $('#revBest').value=r.best||''; $('#revAdjust').value=r.adjust||''; $('#revBlackhole').value=r.blackhole||''; $('#revNote').value=r.note||'';
  const mon=getWeekMonday(); const hist=$('#revHistory'); hist.innerHTML='';
  const days=Object.keys(state.reviews).filter(x=>x>=mon && x<=d).sort().reverse();
  if(days.length===0){ hist.innerHTML='<div class="empty">本周还没有复盘记录</div>'; return; }
  days.forEach(day=>{
    const rv=state.reviews[day];
    const el=document.createElement('div'); el.className='rev-day';
    el.innerHTML=`<div class="rd-date">${day}</div>
      ${rv.best?`<div class="rd-line"><b>最高效：</b>${esc(rv.best)}</div>`:''}
      ${rv.adjust?`<div class="rd-line"><b>要调整：</b>${esc(rv.adjust)}</div>`:''}
      ${rv.blackhole?`<div class="rd-line"><b>时间黑洞：</b>${esc(rv.blackhole)}</div>`:''}
      ${rv.note?`<div class="rd-line">${esc(rv.note)}</div>`:''}`;
    hist.appendChild(el);
  });
}
$('#saveRevBtn').onclick=()=>{
  const d=todayStr();
  state.reviews[d]={ best:$('#revBest').value.trim(), adjust:$('#revAdjust').value.trim(), blackhole:$('#revBlackhole').value.trim(), note:$('#revNote').value.trim() };
  persist(); renderReview(); toast('今日复盘已保存');
};

/* ============================================================================
   导航 / 主题 / 备份
   ============================================================================ */
let currentTab='command';
function switchTab(name){
  currentTab=name;
  $$('.page').forEach(p=>p.classList.remove('active'));
  $('#page-'+name).classList.add('active');
  $$('.bottom-tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));
  if(name==='command') renderCommand();
  else if(name==='tasks') renderTasks();
  else if(name==='progress') renderProgress();
  else if(name==='scores') renderScores();
  else if(name==='review') renderReview();
  window.scrollTo(0,0);
}
$$('.bottom-tabs button').forEach(b=> b.onclick=()=> switchTab(b.dataset.tab));

function applyTheme(){
  document.documentElement.setAttribute('data-theme',state.theme);
  $('#themeIcon').innerHTML = state.theme==='dark'
    ? '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>'
    : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
}
$('#themeBtn').onclick=()=>{ state.theme=state.theme==='dark'?'light':'dark'; persist(); applyTheme(); toast(state.theme==='dark'?'已切换到深色':'已切换到浅色'); };

$('#exportBtn').onclick=()=>{
  const data={ examDate:state.examDate, milestones:state.milestones, tasks:state.tasks, topics:state.topics, scores:state.scores, targets:state.targets, reviews:state.reviews, pe:state.pe, _app:'zk-workbench', _v:1 };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='中考备考台备份_'+todayStr()+'.json'; a.click();
  toast('已导出备份');
};
$('#importBtn').onclick=()=> $('#importFile').click();
$('#importFile').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
    const d=JSON.parse(rd.result);
    if(d.examDate) state.examDate=d.examDate;
    if(d.milestones) state.milestones=d.milestones;
    if(d.tasks) state.tasks=d.tasks;
    if(d.topics) state.topics=d.topics;
    if(d.scores) state.scores=d.scores;
    if(d.targets) state.targets=d.targets;
    if(d.reviews) state.reviews=d.reviews;
    if(d.pe) state.pe=d.pe;
    persist(); closeModal();
    switchTab(currentTab); renderCommand();
    toast('导入成功，共 '+ (state.tasks.length+state.scores.length+state.milestones.length)+' 条');
  }catch(err){ toast('文件解析失败'); } };
  rd.readAsText(f); e.target.value='';
};
$('#clearBtn').onclick=()=> confirmBox('清空全部数据？','将删除所有任务、进度、成绩、复盘与里程碑，且无法恢复。建议先导出备份。',()=>{
  state.milestones=[]; state.tasks=[]; state.scores=[]; state.targets={}; state.reviews={};
  SUBJECTS.forEach(s=> state.topics[s].forEach(t=>t.done=false));
  persist(); switchTab('command'); renderCommand(); toast('已清空全部数据');
});
$('#clearSampleBtn').onclick=()=> confirmBox('清空示例数据？','将移除预置的示例任务与里程碑，你的真实数据不受影响。',()=>{
  state.tasks=state.tasks.filter(t=>!t.rolled);
  state.milestones=[]; persist(); renderCommand(); toast('示例数据已清空');
});

/* 工具：HTML 转义 */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================================================
   启动
   ============================================================================ */
function boot(){
  initState();
  applyTheme();
  if(!_lsOK) setTimeout(()=>toast('提示：当前浏览器限制了本地存储，数据仅本次打开有效'),400);
  buildSubjectSelects();
  buildScoreInputs();
  $('#examDate').value=todayStr();
  // 自动顺延：打开时把昨天未完成任务滚到今天
  const y=addDays(todayStr(),-1);
  const undone=state.tasks.filter(t=>t.date===y && !t.done);
  if(undone.length){ undone.forEach(t=>{ t.date=todayStr(); t.rolled=true; }); persist(); }
  switchTab('command');
  checkLogin();
}

/* 登录 gate（前端轻量校验，仅防误触，非真安全） */
const AUTH_USER='Xsny', AUTH_PASS='Xsny2012';
function checkLogin(){
  const lo=$('#loginOverlay');
  if(sessionStorage.getItem('wb_zk_auth')==='1'){ lo.classList.add('hidden'); return; }
  lo.classList.remove('hidden');
  const tryLogin=()=>{
    const u=$('#loginUser').value.trim(), p=$('#loginPass').value;
    if(u===AUTH_USER && p===AUTH_PASS){ sessionStorage.setItem('wb_zk_auth','1'); lo.classList.add('hidden'); toast('欢迎回来'); }
    else { $('#loginErr').textContent='用户名或密码错误'; $('#loginPass').value=''; }
  };
  $('#loginBtn').onclick=tryLogin;
  $('#loginPass').addEventListener('keydown',e=>{ if(e.key==='Enter') tryLogin(); });
  $('#loginUser').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#loginPass').focus(); } });
}
boot();
})();
