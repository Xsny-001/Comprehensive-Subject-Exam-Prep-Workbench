<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>中考全科备考工作台</title>
<!-- ============================================================
  中考全科备考工作台 · 单文件版
  ★ 定制入口（共 4 处，改这里即可）：
    1. SUBJECTS        —— 学科列表（JS 顶部）
    2. SUBJECT_COLORS  —— 学科配色（JS 顶部）
    3. DEFAULT_TOPICS  —— 各科一轮复习专题清单（JS 顶部）
    4. DEFAULT_EXAM_DATE —— 中考默认日期（JS 顶部）
  工程红线：全内联零外链；图表为手写内联 SVG；不集成任何题库。
============================================================ -->
<style>
/* ============ 主题变量 ============ */
:root{
  --bg:#f6f7f9; --card:#ffffff; --card2:#f0f2f5;
  --text:#2b2f36; --text2:#7a8191; --line:#e5e8ee;
  --accent:#5b7fa6; --accent-soft:#e8eff6;
  --danger:#c0576a; --danger-soft:#f7e9ec;
  --ok:#5d9a6e; --ok-soft:#e7f2ea;
  --warn:#b8934a; --shadow:0 1px 4px rgba(30,40,60,.06);
  --nav-h:60px; --radius:12px;
}
html[data-theme="dark"]{
  --bg:#17191d; --card:#1f2228; --card2:#262a31;
  --text:#e2e5ea; --text2:#8b93a1; --line:#333842;
  --accent:#7f9fc4; --accent-soft:#26303c;
  --danger:#c97183; --danger-soft:#3a262c;
  --ok:#7bb08a; --ok-soft:#243328;
  --warn:#c9a868; --shadow:0 1px 4px rgba(0,0,0,.3);
}
/* ============ 基础 ============ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.55;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{
  font-family:inherit;font-size:16px;color:var(--text);
  background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{min-height:110px;resize:vertical}
h1,h2,h3{font-weight:600}
.hidden{display:none!important}
/* ============ 布局 ============ */
#app{max-width:960px;margin:0 auto;padding:14px 14px 20px}
.topbar{display:flex;align-items:center;gap:10px;padding:6px 2px 12px}
.topbar .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.05rem}
.topbar .spacer{flex:1}
.icon-btn{
  min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:10px;color:var(--text2);
}
.icon-btn:hover{background:var(--card2)}
.icon-btn svg{width:22px;height:22px;fill:currentColor}
/* 顶部导航（PC） */
.tabs{display:flex;gap:6px;background:var(--card);border-radius:12px;padding:5px;box-shadow:var(--shadow);margin-bottom:14px}
.tab{
  flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px;
  border-radius:9px;font-size:.92rem;color:var(--text2);font-weight:500;
}
.tab svg{width:18px;height:18px;fill:currentColor}
.tab.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
/* 卡片 */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h3{font-size:.98rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .right{margin-left:auto;font-weight:400}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.muted{color:var(--text2);font-size:.85rem}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:44px;padding:8px 16px;border-radius:10px;font-size:.92rem;font-weight:500;
  background:var(--card2);color:var(--text);border:1px solid var(--line);
}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.btn.small{min-height:36px;padding:5px 12px;font-size:.84rem}
.btn:active{transform:scale(.97)}
/* ============ 指挥台 ============ */
.countdown-num{font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.cd-item{text-align:center;min-width:64px}
.cd-item .lbl{font-size:.78rem;color:var(--text2)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}
.stat{background:var(--card2);border-radius:10px;padding:12px;text-align:center}
.stat .v{font-size:1.35rem;font-weight:700}
.stat .k{font-size:.78rem;color:var(--text2)}
.milestone{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px dashed var(--line)}
.milestone:last-child{border-bottom:none}
.milestone .days{margin-left:auto;font-weight:700;color:var(--accent);white-space:nowrap}
.milestone.overdue .days{color:var(--danger)}
.milestone .del{color:var(--text2);min-width:44px;min-height:44px}
/* ============ 任务 ============ */
.task-item{
  display:flex;align-items:flex-start;gap:8px;background:var(--card);border-radius:12px;
  box-shadow:var(--shadow);padding:12px;margin-bottom:10px;border-left:4px solid var(--line);
}
.task-item.done{opacity:.55}
.task-item.done .t-content{text-decoration:line-through}
.task-item.rolled{border-left-color:var(--danger)}
.t-check{
  min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.t-check .box{
  width:26px;height:26px;border-radius:8px;border:2px solid var(--text2);
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.task-item.done .box{background:var(--ok);border-color:var(--ok)}
.t-check svg{width:16px;height:16px;fill:#fff}
.t-body{flex:1;min-width:0}
.t-content{font-size:.95rem;word-break:break-word}
.t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.chip{
  display:inline-flex;align-items:center;gap:4px;font-size:.72rem;padding:2px 8px;border-radius:20px;
  background:var(--card2);color:var(--text2);min-height:24px;
}
.chip.subj{color:#fff}
.chip.pri-high{background:var(--danger-soft);color:var(--danger)}
.chip.pri-mid{background:var(--accent-soft);color:var(--accent)}
.chip.pri-low{background:var(--card2);color:var(--text2)}
.chip.rolled-chip{background:var(--danger-soft);color:var(--danger);font-weight:600}
.chip.multi-chip{background:var(--ok-soft);color:var(--ok);cursor:pointer;font-weight:600}
.chip.tomato{background:var(--card2);color:var(--warn)}
.t-acts{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.t-acts .icon-btn{min-width:40px;min-height:36px}
.filter-bar{display:flex;gap:8px;margin-bottom:12px}
.filter-bar select{flex:1;font-size:.9rem;padding:8px 10px}
.date-nav{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:12px}
.date-nav .btn{min-width:44px}
.date-nav .dlabel{font-weight:600;min-width:130px;text-align:center}
/* ============ 进度 ============ */
.subj-bar{margin-bottom:14px}
.subj-bar .head{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:5px}
.bar{height:10px;background:var(--card2);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;transition:width .4s}
.topic-item{display:flex;align-items:center;gap:4px;padding:6px 0;border-bottom:1px dashed var(--line)}
.topic-item .name{flex:1;font-size:.92rem}
.topic-item.done .name{text-decoration:line-through;color:var(--text2)}
.topic-item .icon-btn{min-width:38px;min-height:38px}
.subj-pill{
  min-height:44px;padding:8px 14px;border-radius:10px;font-size:.88rem;font-weight:500;
  border:1px solid var(--line);background:var(--card);color:var(--text);
}
.subj-pill.active{color:#fff;border-color:transparent}
/* ============ 成绩 ============ */
.chart-box{overflow-x:auto}
.chart-box svg{display:block;max-width:100%}
.target-input{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.target-input .sname{flex:1;font-size:.9rem;display:flex;align-items:center;gap:6px}
.target-input input{width:82px;text-align:center;padding:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex-shrink:0}
.score-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);font-size:.86rem}
/* ============ 复盘 ============ */
.guide{font-size:.82rem;color:var(--text2);background:var(--card2);border-radius:8px;padding:8px 12px;margin-bottom:8px}
.review-hist{padding:10px 0;border-bottom:1px dashed var(--line)}
.review-hist .rd{font-weight:600;font-size:.88rem;margin-bottom:4px}
.review-hist .rt{font-size:.86rem;color:var(--text2);white-space:pre-wrap}
/* ============ 番茄钟浮条 ============ */
#pomo-bar{
  position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px);
  max-width:560px;margin:0 auto;background:var(--card);border:2px solid var(--accent);
  border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.18);padding:12px 16px;z-index:60;
  display:flex;align-items:center;gap:12px;
}
#pomo-bar .time{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
#pomo-bar .what{flex:1;min-width:0;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ============ 弹窗 / Toast ============ */
.modal-mask{
  position:fixed;inset:0;background:rgba(20,25,35,.5);z-index:80;
  display:flex;align-items:flex-end;justify-content:center;padding:0;
}
@media(min-width:768px){.modal-mask{align-items:center;padding:20px}}
.modal{
  background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:520px;
  max-height:88vh;overflow-y:auto;padding:20px;
  padding-bottom:calc(20px + env(safe-area-inset-bottom));
}
@media(min-width:768px){.modal{border-radius:18px}}
.modal h3{margin-bottom:14px}
.modal .field{margin-bottom:12px}
.modal .field label{display:block;font-size:.82rem;color:var(--text2);margin-bottom:5px}
.modal .btn-row{display:flex;gap:10px;margin-top:16px}
.modal .btn-row .btn{flex:1}
#toast{
  position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-80px);
  background:var(--text);color:var(--bg);padding:10px 20px;border-radius:30px;font-size:.88rem;
  z-index:100;transition:transform .3s;box-shadow:0 4px 16px rgba(0,0,0,.2);max-width:88vw;text-align:center;
}
#toast.show{transform:translateX(-50%) translateY(0)}
/* ============ 登录 ============ */
#login-screen{
  position:fixed;inset:0;background:var(--bg);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.login-card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:32px 26px;width:100%;max-width:360px}
.login-card h1{font-size:1.2rem;text-align:center;margin-bottom:6px}
.login-card .sub{text-align:center;font-size:.82rem;color:var(--text2);margin-bottom:22px}
.login-card .field{margin-bottom:14px}
.login-card .err{color:var(--danger);font-size:.82rem;text-align:center;min-height:20px;margin-top:8px}
/* ============ 移动端：底部 Tab ============ */
@media(max-width:767px){
  .tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:50;margin:0;border-radius:0;
    height:calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(0,0,0,.08);
  }
  .tab{flex-direction:column;gap:2px;font-size:.68rem;min-height:var(--nav-h)}
  .grid2{grid-template-columns:1fr}
}
@media(min-width:768px){
  .tab .tab-txt{font-size:.92rem}
}
/* 备份提醒条 */
.backup-tip{
  background:var(--accent-soft);color:var(--accent);border-radius:10px;
  padding:10px 14px;font-size:.84rem;margin-bottom:14px;display:flex;align-items:center;gap:8px;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
</style>
</head>
<body>

<!-- ================= 登录 ================= -->
<div id="login-screen">
  <form class="login-card" id="login-form" autocomplete="off">
    <h1>中考全科备考工作台</h1>
    <div class="sub">指挥官模式 · 规划 / 追踪 / 复盘</div>
    <div class="field"><input type="text" id="login-user" placeholder="用户名" autocomplete="username"></div>
    <div class="field"><input type="password" id="login-pass" placeholder="密码" autocomplete="current-password"></div>
    <button type="submit" class="btn primary" style="width:100%">进入工作台</button>
    <div class="err" id="login-err"></div>
  </form>
</div>

<!-- ================= 主应用 ================= -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="logo">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="var(--accent)"><path d="M12 2 2 8l10 6 10-6-10-6zm0 13.5L4.5 11 2 12.4l10 6 10-6L19.5 11 12 15.5z"/></svg>
      中考备考工作台
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="theme-btn" title="切换深浅主题">
      <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-5.4-5.4 5.39 5.39 0 0 1 2.26-4.4c-.44-.06-.9-.1-1.36-.1z"/></svg>
    </button>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="dash"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 10.6 4.2 2.5-.8 1.3L11 13.6V7h2z"/></svg><span class="tab-txt">指挥台</span></button>
    <button class="tab" data-tab="tasks"><svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg><span class="tab-txt">任务</span></button>
    <button class="tab" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M3 13h4v8H3zm7-9h4v17h-4zm7 5h4v12h-4z"/></svg><span class="tab-txt">进度</span></button>
    <button class="tab" data-tab="scores"><svg viewBox="0 0 24 24"><path d="M3.5 18.5 9 13l4 4 7.5-7.5-1.4-1.4L13 14.2l-4-4-6.9 6.9zM15 7h6v6h-2V9.4l-2 2V7z"/></svg><span class="tab-txt">成绩</span></button>
    <button class="tab" data-tab="review"><svg viewBox="0 0 24 24"><path d="M19 3h-4.2a2.8 2.8 0 0 0-5.6 0H5a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7-1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zM7 12h10v2H7zm0 4h7v2H7z"/></svg><span class="tab-txt">复盘</span></button>
  </nav>

  <main id="page"></main>
</div>

<!-- 番茄钟浮条 -->
<div id="pomo-bar" class="hidden">
  <div class="live-dot"></div>
  <div>
    <div class="time" id="pomo-time">25:00</div>
  </div>
  <div class="what" id="pomo-what"></div>
  <button class="btn small" id="pomo-done">提前完成</button>
  <button class="btn small danger" id="pomo-cancel">取消</button>
</div>

<div id="toast"></div>
<div id="modal-root"></div>

<script>
"use strict";
/* ============================================================
   ★ 定制入口 1：学科列表（八科并列，体育在列）
============================================================ */
const SUBJECTS = ["语文","数学","英语","物理","化学","道德与法治","历史","体育"];
const CULTURE_SUBJECTS = ["语文","数学","英语","物理","化学","道德与法治","历史"]; // 文化课（体育目标独立设定）

/* ============================================================
   ★ 定制入口 2：学科配色（低饱和）
============================================================ */
const SUBJECT_COLORS = {
  "语文":"#b5838d","数学":"#6d8ea8","英语":"#7fa081","物理":"#7e86ad",
  "化学":"#a186b8","道德与法治":"#b08d57","历史":"#a08572","体育":"#5f9e97"
};

/* ============================================================
   ★ 定制入口 3：各科一轮复习专题清单
============================================================ */
const DEFAULT_TOPICS = {
  "语文":["字音字形","词语运用","病句修改","古诗文默写","文言文阅读","现代文阅读","名著阅读","作文"],
  "数学":["数与式","方程与不等式","函数及其图象","三角形","四边形","圆","统计与概率","综合压轴题"],
  "英语":["核心词汇","语法专项","完形填空","阅读理解","书面表达","听力训练"],
  "物理":["声与光","热学","力学基础","压强与浮力","简单机械与功","电学基础","欧姆定律","电功率","电与磁"],
  "化学":["物质构成","化学用语","空气与氧气","水与溶液","金属与金属材料","酸碱盐","化学实验","化学计算"],
  "道德与法治":["成长的节拍","友谊与师长","生命的思考","青春时光","做情绪情感的主人","在集体中成长","法律伴我们成长","走进法治天地","国情与责任","时政热点"],
  "历史":["中国古代史","中国近代史","中国现代史","世界古代史","世界近代史","世界现代史"],
  "体育":["1000/800米跑","立定跳远","实心球","一分钟跳绳","球类运球","体能综合训练"]
};

/* ============================================================
   ★ 定制入口 4：中考默认日期（可在页面内修改）
============================================================ */
const DEFAULT_EXAM_DATE = "2027-06-15";

/* 各科默认满分（成绩页可改） */
const DEFAULT_FULL = {"语文":120,"数学":120,"英语":120,"物理":80,"化学":60,"道德与法治":60,"历史":60,"体育":60};

/* ============ 存储层：localStorage，异常时回退内存 ============ */
const PREFIX = "wb_zk_";
let storageOK = true;
const memStore = {};
try { localStorage.setItem(PREFIX+"__t","1"); localStorage.removeItem(PREFIX+"__t"); }
catch(e){ storageOK = false; }
const store = {
  get(k, d){
    try{
      const raw = storageOK ? localStorage.getItem(PREFIX+k) : memStore[k];
      return raw == null ? d : JSON.parse(raw);
    }catch(e){ return d; }
  },
  set(k, v){
    const raw = JSON.stringify(v);
    try{ if(storageOK) localStorage.setItem(PREFIX+k, raw); else memStore[k] = raw; }
    catch(e){ memStore[k] = raw; }
  },
  remove(k){ try{ if(storageOK) localStorage.removeItem(PREFIX+k); }catch(e){} delete memStore[k]; }
};

/* ============ 工具 ============ */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,"0");
function dstr(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function todayStr(){ return dstr(new Date()); }
function addDays(str, n){ const d = new Date(str+"T00:00:00"); d.setDate(d.getDate()+n); return dstr(d); }
function daysBetween(a, b){ return Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00"))/86400000); }
function cnDate(str){ const p=str.split("-"); return Number(p[1])+"月"+Number(p[2])+"日"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2200);
}
function subjDot(s){ return '<span class="dot" style="background:'+(SUBJECT_COLORS[s]||"#999")+'"></span>'; }

/* ============ 状态 ============ */
let state = {
  examDate: store.get("examDate", DEFAULT_EXAM_DATE),
  milestones: store.get("milestones", []),
  tasks: store.get("tasks", []),
  plans: store.get("plans", []),
  topics: store.get("topics", null),
  scores: store.get("scores", []),
  cultureTargets: store.get("cultureTargets", {}),

/* 倒计时实时跳动 */
let cdTimer = null;
function tickCountdown(){
  clearInterval(cdTimer);
  const upd = ()=>{
    if(curTab!=="dash"){ clearInterval(cdTimer); return; }
    const target = new Date(state.examDate+"T08:00:00");
    let diff = Math.max(0, target - new Date());
    const d = Math.floor(diff/86400000); diff -= d*86400000;
    const h = Math.floor(diff/3600000); diff -= h*3600000;
    const m = Math.floor(diff/60000); const s = Math.floor((diff-m*60000)/1000);
    const set=(id,v)=>{ const el=$(id); if(el) el.textContent = v; };
    set("#cd-d", d); set("#cd-h", pad(h)); set("#cd-m", pad(m)); set("#cd-s", pad(s));
  };
  upd(); cdTimer = setInterval(upd, 1000);
}

function taskClickHandler(e){
  const q = sel => e.target.closest(sel);
  let el;
  if((el = q("[data-toggle]"))){
    const t = state.tasks.find(x=>x.id===el.dataset.toggle);
    t.done = !t.done; if(t.done) t.rolled = false;
    save("tasks"); renderTasks();
    if(t.done) toast("完成！继续保持 💪");
  }
  else if((el = q("[data-del]"))){
    if(!confirm("删除这条任务？")) return;
    state.tasks = state.tasks.filter(x=>x.id!==el.dataset.del);
    save("tasks"); renderTasks(); toast("已删除");
  }
  else if((el = q("[data-up]"))){ moveTask(el.dataset.up, -1); }
  else if((el = q("[data-down]"))){ moveTask(el.dataset.down, 1); }
  else if((el = q("[data-pomo]"))){ startPomo(el.dataset.pomo); }
  else if((el = q("[data-plan]"))){ openPlanPanel(el.dataset.plan); }
}
function moveTask(id, dir){
  const day = tasksOf(taskDate);
  const i = day.findIndex(t=>t.id===id), j = i+dir;
  if(i<0||j<0||j>=day.length) return;
  [day[i].order, day[j].order] = [day[j].order, day[i].order];
  save("tasks"); renderTasks();
}

        state.tasks.push({id:uid(), date:addDays(start,i), subject:subj,
          content:content+"（第 "+(i+1)+" 天 / 共 "+days+" 天）", priority:pri,
          done:false, tomatoes:0, rolled:false, order:100+i, planId:pid});
      }

function openPlanPanel(pid){
  const p = state.plans.find(x=>x.id===pid); if(!p) return;

  const doneN = inst.filter(t=>t.done).length;
  openModal('<h3>多天计划 · 批量管理</h3>'+
    '<div class="muted" style="margin-bottom:12px">'+p.start+' ~ '+p.end+' · 共 '+inst.length+' 天 · 已完成 '+doneN+' 天</div>'+

    '<div class="field"><label>优先级</label><select id="pp-pri">'+["高","中","低"].map(x=>'<option '+(x===p.priority?"selected":"")+'>'+x+'</option>').join("")+'</select></div>'+
    '<div class="btn-row"><button class="btn danger" id="pp-del">删除整个计划</button><button class="btn" data-close>取消</button><button class="btn primary" id="pp-save">批量应用</button></div>');
  $("#pp-save").onclick = ()=>{
    const content = $("#pp-content").value.trim() || p.content;
    p.content = content; p.subject = $("#pp-subj").value; p.priority = $("#pp-pri").value;
    const days = daysBetween(p.start, p.end)+1;
    inst.forEach(t=>{
      const idx = daysBetween(p.start, t.date);
      t.subject = p.subject; t.priority = p.priority;
      t.content = content + "（第 "+(idx+1)+" 天 / 共 "+days+" 天）";
    });
    save("plans"); save("tasks"); closeModal(); renderTasks(); toast("已批量更新整个计划");
  };
  $("#pp-del").onclick = ()=>{
    if(!confirm("删除整个多天计划？所有日期的实例都会被删除。")) return;
    state.tasks = state.tasks.filter(t=>t.planId!==pid);
    state.plans = state.plans.filter(x=>x.id!==pid);
    save("plans"); save("tasks"); closeModal(); renderTasks(); toast("计划已删除");
  };
}

/* ============ 番茄钟 ============ */
let pomo = null; // {taskId, left, timer}
function startPomo(tid){
  if(pomo){ toast("已有番茄钟进行中"); return; }
  const t = state.tasks.find(x=>x.id===tid); if(!t) return;
  pomo = {taskId:tid, left:25*60, timer:null};
  $("#pomo-what").textContent = "专注中：" + t.content;
  $("#pomo-bar").classList.remove("hidden");
  updPomo();
  pomo.timer = setInterval(()=>{
    pomo.left--;
    if(pomo.left<=0){ finishPomo(true); } else updPomo();
  }, 1000);
  toast("番茄钟启动，专注 25 分钟！");
}
function updPomo(){
  $("#pomo-time").textContent = pad(Math.floor(pomo.left/60))+":"+pad(pomo.left%60);
}
function finishPomo(countIt){
  clearInterval(pomo.timer);
  if(countIt){
    const t = state.tasks.find(x=>x.id===pomo.taskId);
    if(t){ t.tomatoes = (t.tomatoes||0)+1; save("tasks"); }
    toast("🍅 番茄钟完成！已记录");
  }
  pomo = null;
  $("#pomo-bar").classList.add("hidden");
  if(curTab==="tasks") renderTasks();
}
$("#pomo-done").onclick = ()=> pomo && finishPomo(true);
$("#pomo-cancel").onclick = ()=> pomo && finishPomo(false);

/* ---- 手写 SVG：单科折线图 ---- */
function lineChartSVG(exams, subj){
  const W=640, H=220, P={l:40,r:14,t:16,b:34};
  const full = subj==="体育" ? state.peTarget.full : (state.fullScores[subj]||100);
  const target = subj==="体育" ? state.peTarget.target : (state.cultureTargets[subj]||0);
  const pts = exams.map((e,i)=>{
    const v = Number(e.scores[subj]);
    return {x: P.l + (exams.length>1 ? i*(W-P.l-P.r)/(exams.length-1) : (W-P.l-P.r)/2),
            y: isNaN(v)?null : P.t + (1 - v/full)*(H-P.t-P.b), v, label:e.name};
  });
  const path = pts.filter(p=>p.y!=null).map((p,i)=>(i===0?"M":"L")+p.x.toFixed(1)+","+p.y.toFixed(1)).join(" ");
  const tgtY = target ? P.t + (1 - target/full)*(H-P.t-P.b) : null;
  let s = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="min-width:420px">';
  [0,.25,.5,.75,1].forEach(r=>{
    const y = P.t + r*(H-P.t-P.b);
    s += '<line x1="'+P.l+'" y1="'+y+'" x2="'+(W-P.r)+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>'+
         '<text x="'+(P.l-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="var(--text2)">'+Math.round(full*(1-r))+'</text>';
  });
  if(tgtY!=null) s += '<line x1="'+P.l+'" y1="'+tgtY+'" x2="'+(W-P.r)+'" y2="'+tgtY+'" stroke="var(--danger)" stroke-width="1.5" stroke-dasharray="6 4"/>'+
    '<text x="'+(W-P.r)+'" y="'+(tgtY-4)+'" text-anchor="end" font-size="10" fill="var(--danger)">目标 '+target+'</text>';
  s += '<path d="'+path+'" fill="none" stroke="'+SUBJECT_COLORS[subj]+'" stroke-width="2.5" stroke-linejoin="round"/>';
  pts.forEach(p=>{
    if(p.y==null) return;
    s += '<circle cx="'+p.x+'" cy="'+p.y+'" r="4" fill="'+SUBJECT_COLORS[subj]+'"/>'+
         '<text x="'+p.x+'" y="'+(p.y-9)+'" text-anchor="middle" font-size="10" fill="var(--text2)">'+p.v+'</text>'+
         '<text x="'+p.x+'" y="'+(H-12)+'" text-anchor="middle" font-size="9" fill="var(--text2)">'+esc(p.label.slice(0,5))+'</text>';
  });
  return s+'</svg>';
}
/* ---- 手写 SVG：总分趋势 ---- */
function totalChartSVG(exams){
  const W=640, H=220, P={l:46,r:14,t:16,b:34};
  const fullTotal = CULTURE_SUBJECTS.reduce((s,k)=>s+(state.fullScores[k]||0),0) + state.peTarget.full;
  const tgtTotal = CULTURE_SUBJECTS.reduce((s,k)=>s+(Number(state.cultureTargets[k])||0),0) + state.peTarget.target;
  const vals = exams.map(e=>SUBJECTS.reduce((s,k)=>s+(Number(e.scores[k])||0),0));
  const pts = vals.map((v,i)=>({x: P.l + (exams.length>1 ? i*(W-P.l-P.r)/(exams.length-1) : (W-P.l-P.r)/2),
                                 y: P.t + (1 - v/fullTotal)*(H-P.t-P.b), v}));
  const path = pts.map((p,i)=>(i===0?"M":"L")+p.x.toFixed(1)+","+p.y.toFixed(1)).join(" ");
  let s = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="min-width:420px">';
  [0,.5,1].forEach(r=>{
    const y = P.t + r*(H-P.t-P.b);
    s += '<line x1="'+P.l+'" y1="'+y+'" x2="'+(W-P.r)+'" y2="'+y+'" stroke="var(--line)"/>'+
         '<text x="'+(P.l-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="var(--text2)">'+Math.round(fullTotal*(1-r))+'</text>';
  });
  if(tgtTotal>0){
    const ty = P.t + (1 - tgtTotal/fullTotal)*(H-P.t-P.b);
    s += '<line x1="'+P.l+'" y1="'+ty+'" x2="'+(W-P.r)+'" y2="'+ty+'" stroke="var(--danger)" stroke-width="1.5" stroke-dasharray="6 4"/>'+
      '<text x="'+(W-P.r)+'" y="'+(ty-4)+'" text-anchor="end" font-size="10" fill="var(--danger)">目标总分 '+tgtTotal+'</text>';
  }
  s += '<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>';
  pts.forEach((p,i)=>{
    s += '<circle cx="'+p.x+'" cy="'+p.y+'" r="4" fill="var(--accent)"/>'+
         '<text x="'+p.x+'" y="'+(p.y-9)+'" text-anchor="middle" font-size="10" fill="var(--text2)">'+p.v+'</text>'+
         '<text x="'+p.x+'" y="'+(H-12)+'" text-anchor="middle" font-size="9" fill="var(--text2)">'+esc(exams[i].name.slice(0,5))+'</text>';
  });
  return s+'</svg>';
}
/* ---- 手写 SVG：八科雷达图 ---- */
function radarSVG(latest){
  const S=320, cx=S/2, cy=S/2, R=105, N=SUBJECTS.length;
  const pt = (i, r)=>{
    const a = -Math.PI/2 + i*2*Math.PI/N;
    return [cx + r*Math.cos(a), cy + r*Math.sin(a)];
  };
  let s = '<svg viewBox="0 0 '+S+' '+S+'" width="'+S+'" height="'+S+'">';
  [.25,.5,.75,1].forEach(r=>{
    s += '<polygon points="'+SUBJECTS.map((_,i)=>pt(i,R*r).map(n=>n.toFixed(1)).join(",")).join(" ")+
      '" fill="none" stroke="var(--line)" stroke-width="1"/>';
  });
  SUBJECTS.forEach((sub,i)=>{
    const [x,y] = pt(i,R);
    const [lx,ly] = pt(i,R+18);
    s += '<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="var(--line)"/>'+
      '<text x="'+lx+'" y="'+ly+'" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="'+SUBJECT_COLORS[sub]+'" font-weight="600">'+sub+'</text>';
  });
  // 实际达成率
  const act = SUBJECTS.map((sub,i)=>{
    const full = sub==="体育"?state.peTarget.full:(state.fullScores[sub]||100);
    const v = Number(latest.scores[sub])||0;
    return pt(i, R*Math.min(1, v/full)).map(n=>n.toFixed(1)).join(",");
  });
  // 目标环
  const tgt = SUBJECTS.map((sub,i)=>{
    const full = sub==="体育"?state.peTarget.full:(state.fullScores[sub]||100);
    const t = sub==="体育"?state.peTarget.target:(Number(state.cultureTargets[sub])||0);
    return pt(i, R*Math.min(1, t/full)).map(n=>n.toFixed(1)).join(",");
  });
  s += '<polygon points="'+tgt.join(" ")+'" fill="none" stroke="var(--danger)" stroke-width="1.5" stroke-dasharray="5 3"/>';
  s += '<polygon points="'+act.join(" ")+'" fill="var(--accent)" fill-opacity=".22" stroke="var(--accent)" stroke-width="2"/>';
  return s+'</svg>';
}

      '<div class="guide">🔧 明天必须调整什么？</div>'+
      '<div class="guide">🕳️ 今日时间黑洞？</div>'+
      '<textarea id="rv-text" placeholder="围绕上面三个问题写几句就好，复盘不在长，在坚持。">'+esc(state.reviews[reviewDate]||"")+'</textarea>'+
      '<div class="btn-row" style="display:flex;gap:10px;margin-top:12px">'+
        '<button class="btn primary" id="rv-save" style="flex:1">保存复盘</button>'+
        (state.reviews[reviewDate]?'<button class="btn danger" id="rv-del">删除</button>':"")+'</div></div>'+
    '<div class="card"><h3>本周复盘历史</h3>'+
      (week.length ? week.map(w=>'<div class="review-hist"><div class="rd">'+w.d+'（'+cnDate(w.d)+'）</div><div class="rt">'+esc(w.text)+'</div></div>').join("")
                   : '<div class="muted">本周还没有复盘记录。</div>')+
    '</div>';
  $("#rv-date").onchange = e=>{ reviewDate = e.target.value || today; renderReview(); };
  const bt = $("#rv-today"); if(bt) bt.onclick = ()=>{ reviewDate = today; renderReview(); };
  $("#rv-save").onclick = ()=>{
    const v = $("#rv-text").value.trim();
    if(v) state.reviews[reviewDate] = v; else delete state.reviews[reviewDate];
    save("reviews"); renderReview(); toast("复盘已保存");
  };
  const del = $("#rv-del");
  if(del) del.onclick = ()=>{
    if(!confirm("删除 "+reviewDate+" 的复盘？")) return;
    delete state.reviews[reviewDate]; save("reviews"); renderReview(); toast("已删除");
  };
}

/* ============================================================
   备份：导出 / 导入 / 清空
============================================================ */
function exportJSON(){
  const data = {};
  ["examDate","milestones","tasks","plans","topics","scores","cultureTargets","peTarget","fullScores","reviews"].forEach(k=>data[k]=state[k]);
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "中考备考工作台备份_"+todayStr()+".json";
  a.click(); URL.revokeObjectURL(a.href);
  toast("备份文件已导出");
}
function importJSON(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(typeof data !== "object" || !data) throw 0;
      ["examDate","milestones","tasks","plans","topics","scores","cultureTargets","peTarget","fullScores","reviews"].forEach(k=>{
        if(data[k] !== undefined) state[k] = data[k];
      });
      saveAll(); rollover(); render(); toast("导入成功，数据已恢复");
    }catch(err){ toast("导入失败：文件格式不正确"); }
    e.target.value = "";
  };
  reader.readAsText(file);
}
function clearAll(){
  if(!confirm("确定清空全部数据？此操作不可恢复！")) return;
  if(!confirm("再次确认：任务、进度、成绩、复盘将全部删除。建议先导出备份。仍要清空吗？")) return;
  ["examDate","milestones","tasks","plans","topics","scores","cultureTargets","peTarget","fullScores","reviews","seeded"].forEach(k=>store.remove(k));
  location.reload();
}
function clearSeed(){
  if(!confirm("清空示例数据？将只保留一张空白工作台（你的正式数据建议先导出备份）。")) return;
  ["milestones","tasks","plans","scores","reviews"].forEach(k=>store.remove(k));
  state.topics = {};
  SUBJECTS.forEach(s=>state.topics[s] = DEFAULT_TOPICS[s].map(n=>({name:n, done:false})));
  save("topics");
  state.milestones=[]; state.tasks=[]; state.plans=[]; state.scores=[]; state.reviews={};
  saveAll(); render(); toast("示例数据已清空，开始你的正式备考吧！");
}

/* ============ 弹窗 ============ */
function openModal(html){
  $("#modal-root").innerHTML = '<div class="modal-mask"><div class="modal">'+html+'</div></div>';
  $(".modal-mask").addEventListener("click", e=>{
    if(e.target.classList.contains("modal-mask") || e.target.closest("[data-close]")) closeModal();
  });
}
function closeModal(){ $("#modal-root").innerHTML = ""; }

/* ============ 全局事件委托（只绑定一次，按当前 Tab 分发） ============ */
$("#page").addEventListener("click", e=>{
  if(curTab==="tasks") taskClickHandler(e);
  else if(curTab==="progress") progClickHandler(e);
  else if(curTab==="scores") scoreClickHandler(e);
});
$("#page").addEventListener("change", e=>{
  if(curTab==="scores") scoreChangeHandler(e);
});
// 桌面端任务拖拽排序（移动端用 ▲▼ 按钮）
let dragTaskId = null;
$("#page").addEventListener("dragstart", e=>{
  if(curTab!=="tasks") return;
  const it = e.target.closest(".task-item"); if(it) dragTaskId = it.dataset.tid;
});
$("#page").addEventListener("dragover", e=>{ if(curTab==="tasks") e.preventDefault(); });
$("#page").addEventListener("drop", e=>{
  if(curTab!=="tasks") return;
  e.preventDefault();
  const it = e.target.closest(".task-item");
  if(!it || !dragTaskId || it.dataset.tid===dragTaskId) return;
  const day = tasksOf(taskDate);
  const from = day.findIndex(t=>t.id===dragTaskId), to = day.findIndex(t=>t.id===it.dataset.tid);
  if(from<0||to<0) return;
  const [moved] = day.splice(from,1); day.splice(to,0,moved);
  day.forEach((t,i)=>t.order=i); save("tasks"); renderTasks();
});
// 指挥台弹窗内的保存按钮（里程碑 / 中考日期）
document.body.addEventListener("click", msHandler);

/* ============ 渲染入口 ============ */
function render(){
  if(curTab==="dash") renderDash();
  else if(curTab==="tasks") renderTasks();
  else if(curTab==="progress") renderProgress();
  else if(curTab==="scores") renderScores();
  else if(curTab==="review") renderReview();
}
render();
</script>
